plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def localProps = new Properties()
def localPropsFile = rootProject.file("local.properties")
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}

def secret = { String key ->
    localProps.getProperty(key) ?: System.getenv(key)
}

android {
    namespace 'com.test.memoryhog'
    compileSdk 35

    defaultConfig {
        applicationId "com.test.memoryhog"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
            }
        }

        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    signingConfigs {
        release {
            def keystorePath = secret("MEMHOG_KEYSTORE")
            if (keystorePath) {
                storeFile     file(keystorePath)
                storePassword secret("MEMHOG_STORE_PASSWORD")
                keyAlias      secret("MEMHOG_KEY_ALIAS") ?: "memoryhog"
                keyPassword   secret("MEMHOG_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            if (secret("MEMHOG_KEYSTORE")) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }

    buildFeatures {
        viewBinding true
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.14.0'
}
